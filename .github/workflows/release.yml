name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. 0.2+1 or v0.2+1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release tag and artifact names
        id: release_info
        shell: bash
        run: |
          CODE_VER=$(cat VERSION | cut -d ' ' -f 1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${CODE_VER:-0.2+2}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "pkg_dir=rpl-${TAG}-windows-x64" >> $GITHUB_OUTPUT
            echo "artifact=rpl-${TAG}-windows-x64.zip" >> $GITHUB_OUTPUT
          else
            echo "pkg_dir=rpl-${TAG}-linux-x64" >> $GITHUB_OUTPUT
            echo "artifact=rpl-${TAG}-linux-x64.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Compile rpl_cli binary
        run: cargo build --release -p rpl_cli --target ${{ matrix.target }}

      - name: Package release artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $pkgDir = "${{ steps.release_info.outputs.pkg_dir }}"
          $artifact = "${{ steps.release_info.outputs.artifact }}"
          New-Item -ItemType Directory -Path $pkgDir -Force
          Copy-Item -Path "target/${{ matrix.target }}/release/rpl.exe" -Destination "$pkgDir/"
          Copy-Item -Path "examples/reaktor.rpl" -Destination "$pkgDir/"
          Copy-Item -Path "README.md" -Destination "$pkgDir/"
          Copy-Item -Path "docs/LANGUAGE_GUIDE.md" -Destination "$pkgDir/"
          Compress-Archive -Path $pkgDir -DestinationPath $artifact -Force

      - name: Package release artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          PKG_DIR="${{ steps.release_info.outputs.pkg_dir }}"
          ARTIFACT="${{ steps.release_info.outputs.artifact }}"
          mkdir -p "$PKG_DIR"
          cp "target/${{ matrix.target }}/release/rpl" "$PKG_DIR/"
          cp "examples/reaktor.rpl" "$PKG_DIR/"
          cp "README.md" "$PKG_DIR/"
          cp "docs/LANGUAGE_GUIDE.md" "$PKG_DIR/"
          tar -czvf "$ARTIFACT" "$PKG_DIR"

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Release ${{ steps.release_info.outputs.tag }}
          files: ${{ steps.release_info.outputs.artifact }}
          generate_release_notes: true
