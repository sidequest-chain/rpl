name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rpl-${{ github.ref_name }}-windows-x64.zip
            pkg_dir: rpl-${{ github.ref_name }}-windows-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: rpl-${{ github.ref_name }}-linux-x64.tar.gz
            pkg_dir: rpl-${{ github.ref_name }}-linux-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Compile rpl_cli binary
        run: cargo build --release -p rpl_cli --target ${{ matrix.target }}

      - name: Package release artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ matrix.pkg_dir }}"
          Copy-Item -Path "target/${{ matrix.target }}/release/rpl.exe" -Destination "${{ matrix.pkg_dir }}/"
          Copy-Item -Path "examples/reaktor.rpl" -Destination "${{ matrix.pkg_dir }}/"
          Copy-Item -Path "README.md" -Destination "${{ matrix.pkg_dir }}/"
          Copy-Item -Path "docs/LANGUAGE_GUIDE.md" -Destination "${{ matrix.pkg_dir }}/"
          Compress-Archive -Path "${{ matrix.pkg_dir }}" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Package release artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "${{ matrix.pkg_dir }}"
          cp "target/${{ matrix.target }}/release/rpl" "${{ matrix.pkg_dir }}/"
          cp "examples/reaktor.rpl" "${{ matrix.pkg_dir }}/"
          cp "README.md" "${{ matrix.pkg_dir }}/"
          cp "docs/LANGUAGE_GUIDE.md" "${{ matrix.pkg_dir }}/"
          tar -czvf "${{ matrix.artifact_name }}" "${{ matrix.pkg_dir }}"

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
